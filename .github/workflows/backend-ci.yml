name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/authService

jobs:
  test:
    name: Lint and test authService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/authService/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  container:
    name: Build authService container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build .

  event-request-test:
    name: Lint and test eventRequestService
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/eventRequestService
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/eventRequestService/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  event-request-container:
    name: Build eventRequestService container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/eventRequestService
    steps:
      - uses: actions/checkout@v6
      - run: docker build .
