name: Backend CI

on:
  # Any branch: lets a story prove its jobs green before the pull request.
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "database/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "database/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authService, venueService, equipmentService, notificationService]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  container:
    name: Build ${{ matrix.service }} container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authService, venueService, equipmentService, notificationService]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  event-request-test:
    name: Lint and test eventRequestService
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/eventRequestService
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/eventRequestService/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  event-request-container:
    name: Build eventRequestService container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/eventRequestService
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  database-verify:
    name: Verify the SCRUM-19 database schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Create the empty disposable database
        run: >-
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres
          -c 'CREATE DATABASE scrum48_ci'
      - name: Apply migrations through 0052
        run: >-
          python3 -I database/tests/bootstrap_safety_review.py --disposable
          --dsn postgresql://postgres@127.0.0.1:5432/scrum48_ci
          --through 0052_technical_support_assignments.sql
      - name: Run the SCRUM-19 verifier
        run: >-
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d scrum48_ci
          -f database/verify_technical_support_assignments.sql

  scrum35-database-verify:
    name: Verify SCRUM-35 native amendments and lock protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCRUM35_TEST_DSN: postgresql://postgres@127.0.0.1:5432/scrum48_ci35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Create the empty disposable amendment database
        run: >-
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres
          -c 'CREATE DATABASE scrum48_ci35'
      - name: Bootstrap the canonical amendment prerequisites
        run: >-
          python3 -I database/tests/bootstrap_event_change_approval.py --disposable
          --dsn "$SCRUM35_TEST_DSN"
      - name: Verify atomic decisions, review work and retained workflows
        shell: bash
        run: |
          set -euo pipefail
          for verifier in \
            verify_event_change_rejection.sql \
            verify_event_change_approval.sql \
            verify_versioned_venue_booking_creation.sql \
            verify_event_registration_reviews.sql \
            verify_event_change_date_approval.sql \
            verify_arrangement_review_flags.sql \
            verify_venue_timing_change_reviews.sql \
            verify_venue_block_booking_reviews.sql
          do
            psql -X -v ON_ERROR_STOP=1 -d "$SCRUM35_TEST_DSN" -f "database/$verifier"
          done
      - name: Verify competing approval and booking-membership transactions
        shell: bash
        run: |
          set -euo pipefail
          python3 database/tests/test_event_change_approval_concurrency.py --dsn "$SCRUM35_TEST_DSN" --disposable
          python3 database/tests/test_date_change_concurrency.py --dsn "$SCRUM35_TEST_DSN" --disposable
