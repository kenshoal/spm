name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authService, venueService, equipmentService, equipmentStatusService]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  container:
    name: Build ${{ matrix.service }} container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authService, venueService, equipmentService, equipmentStatusService]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  event-request-test:
    name: Lint and test eventRequestService
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/eventRequestService
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/eventRequestService/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  event-request-container:
    name: Build eventRequestService container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/eventRequestService
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
