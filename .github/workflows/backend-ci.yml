name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authService, venueService]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/${{ matrix.service }}/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  container:
    name: Build ${{ matrix.service }} container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authService, venueService]
    steps:
      - uses: actions/checkout@v6
      - run: docker build .
        working-directory: backend/${{ matrix.service }}
