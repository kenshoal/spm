services:
  auth-service:
    build:
      context: ./backend/authService
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  event-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: event
      POSTGRES_PASSWORD: event
      POSTGRES_DB: event
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event"]
      interval: 5s
      timeout: 3s
      retries: 5

  event-service:
    build:
      context: ./backend/eventService
    environment:
      DATABASE_URL: postgresql+psycopg://event:event@event-db:5432/event
    ports:
      - "8002:8000"
    depends_on:
      event-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
