services:
  event-request-service:
    build:
      context: ./backend/eventRequestService
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8003:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      # No depends_on: a notification failure must never block assignment.
      NOTIFICATION_SERVICE_URL: http://notification-service:8000/notifications/events
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  auth-service:
    build:
      context: ./backend/authService
    environment:
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  equipment-service:
    build:
      context: ./backend/equipmentService
    depends_on:
      auth-service:
        condition: service_healthy
      venue-service:
        condition: service_healthy
    ports:
      - "8002:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      VENUE_SERVICE_URL: http://venue-service:8000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  venue-service:
    build:
      context: ./backend/venueService
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8004:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      # No depends_on: only booking-request submission calls this service.
      EVENT_REQUEST_API_URL: http://event-request-service:8000
      VENUE_STORAGE_BACKEND: supabase
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  notification-service:
    build:
      context: ./backend/notificationService
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8005:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
