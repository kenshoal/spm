services:
  event-request-service:
    build:
      context: ./backend/eventRequestService
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8003:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      AUTO_COMPLETION_ENABLED: ${AUTO_COMPLETION_ENABLED:-false}
      PERIODIC_TASK_INTERVAL_SECONDS: ${PERIODIC_TASK_INTERVAL_SECONDS:-60}
      REGISTRATION_WINDOW_NOTICES_ENABLED: ${REGISTRATION_WINDOW_NOTICES_ENABLED:-false}
      REGISTRATION_WINDOW_LOOKBACK_HOURS: ${REGISTRATION_WINDOW_LOOKBACK_HOURS:-72}
      # SCRUM-24: offers expire and waiting-list notices go out only with this on.
      WAITLIST_TIMERS_ENABLED: ${WAITLIST_TIMERS_ENABLED:-true}
      # No depends_on: a notification failure must never block assignment.
      NOTIFICATION_SERVICE_URL: http://notification-service:8000/notifications/events
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:-local-development-only}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  auth-service:
    build:
      context: ./backend/authService
    environment:
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  equipment-service:
    build:
      context: ./backend/equipmentService
    depends_on:
      auth-service:
        condition: service_healthy
      venue-service:
        condition: service_healthy
    ports:
      - "8002:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      VENUE_SERVICE_URL: http://venue-service:8000
      # No depends_on: only requirement recording calls this service.
      EVENT_REQUEST_SERVICE_URL: http://event-request-service:8000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  venue-service:
    build:
      context: ./backend/venueService
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8004:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      # No depends_on: only booking-request submission calls this service.
      EVENT_REQUEST_API_URL: http://event-request-service:8000
      # No depends_on: a notification failure must never block a booking decision.
      NOTIFICATION_SERVICE_URL: http://notification-service:8000/notifications/events
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:-local-development-only}
      VENUE_STORAGE_BACKEND: supabase
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  notification-service:
    build:
      context: ./backend/notificationService
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "8005:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      # Only services holding this may post events. Set your own outside local use.
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:-local-development-only}
      # Email (SCRUM-57). Leave SMTP_HOST empty to keep email switched off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: "${MAIL_FROM:-SPM Notifications <no-reply@localhost>}"
      INBOX_URL: ${INBOX_URL:-http://localhost:3000/notifications}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
